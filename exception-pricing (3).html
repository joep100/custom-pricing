<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Exception pricing (prototype)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F2F2F0;--surface:#FFFFFF;--ink:#262626;--muted:#666A6D;--line:#DEDEDA;
  --brand:#FF9900;--brand-ink:#262626;--char:#4A4A4A;--char-deep:#333333;
  --zone:#E2E2DE;--zone-hover:#D2D2CD;--zone-edge:#FFFFFF;--zone-op:.32;--from:#333333;--to:#FF9900;--to-soft:rgba(255,153,0,.16);
  --danger:#C4320A;--focus:#1B5FD6;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#1B1B1B;--surface:#242424;--ink:#EDEDED;--muted:#A3A3A3;--line:#383838;
  --char:#2C2C2C;--char-deep:#161616;--zone:#2F2F2F;--zone-hover:#3A3A3A;--zone-edge:#1B1B1B;--zone-op:.38;--from:#F2F2F2;--to:#FF9900;--to-soft:rgba(255,153,0,.2);
  --danger:#FF7A59;--focus:#7EA8FF;}}
:root[data-theme="dark"]{
  --bg:#1B1B1B;--surface:#242424;--ink:#EDEDED;--muted:#A3A3A3;--line:#383838;
  --char:#2C2C2C;--char-deep:#161616;--zone:#2F2F2F;--zone-hover:#3A3A3A;--zone-edge:#1B1B1B;--zone-op:.38;--from:#F2F2F2;--to:#FF9900;--to-soft:rgba(255,153,0,.2);
  --danger:#FF7A59;--focus:#7EA8FF;}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;height:100%;background:var(--bg);color:var(--ink);
  font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;font-size:15px;line-height:1.45;
  display:flex;flex-direction:column}
header{display:flex;align-items:center;gap:18px;flex-wrap:wrap;padding:12px 22px;background:var(--surface);border-bottom:3px solid var(--brand);color:var(--ink)}
.mark{font:italic 900 34px/1 'Titillium Web',Inter,system-ui,sans-serif;letter-spacing:-.01em;color:#fff;margin:0}
header h1{font-size:19px;font-weight:700;margin:0}
header p{margin:0;color:var(--muted);font-size:13.5px}
.app{flex:1;display:grid;grid-template-columns:minmax(0,1fr) 420px;min-height:0}
.mapwrap{position:relative;min-height:0;overflow:hidden}
#map{width:100%;height:100%;display:block;touch-action:none;cursor:pointer;user-select:none}
#map.dragging{cursor:grabbing}
.z{fill:var(--zone);stroke:var(--zone-edge);stroke-width:1.2;vector-effect:non-scaling-stroke;transition:fill .12s}
.z:hover{fill:var(--zone-hover)}
.z.from{fill:var(--from)}
.z.to{fill:var(--to)}
.z.linked{fill:var(--to-soft);stroke:var(--brand);stroke-width:2}
.lbl{font-weight:600;fill:var(--muted);pointer-events:none;text-anchor:middle;dominant-baseline:central}
.lbl.on{fill:#262626}
.lbl.on.f{fill:var(--bg)}
.ln{stroke:var(--from);stroke-width:2;vector-effect:non-scaling-stroke;fill:none;opacity:.55;pointer-events:none}
.ln.oneway{stroke-dasharray:5 4}
.ln.hot{opacity:1;stroke-width:3}
.dot{fill:var(--from);pointer-events:none}
.mapctl{position:absolute;right:12px;top:12px;display:flex;flex-direction:column;gap:6px}
.mapctl button{width:40px;height:40px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:600 18px Inter,system-ui,sans-serif;cursor:pointer}
.mapctl button.fit{font-size:12px}
.hint{position:absolute;left:12px;top:12px;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 12px;font-size:13.5px;max-width:calc(100% - 80px)}
.legend{position:absolute;left:12px;bottom:12px;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 12px;font-size:12.5px;display:flex;gap:14px;flex-wrap:wrap;color:var(--muted)}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;vertical-align:-2px;margin-right:5px}
#tip{position:absolute;pointer-events:none;background:var(--ink);color:var(--surface);font-size:12.5px;font-weight:600;padding:3px 8px;border-radius:5px;display:none;white-space:nowrap}
.panel{background:var(--surface);border-left:1px solid var(--line);overflow:auto;padding:18px 20px 28px}
.panel h2{font-size:15px;font-weight:700;margin:24px 0 10px}
.panel h2:first-child{margin-top:0}
label.fld{display:block;font-size:13px;color:var(--muted);margin-bottom:4px}
input[type=text]{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:7px;padding:8px 10px;width:100%}
input[type=text]:focus-visible,button:focus-visible{outline:2px solid var(--focus);outline-offset:1px}
.route{display:flex;flex-wrap:wrap;align-items:center;gap:6px;font-size:14px}
.chip{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:999px;font-weight:600;font-size:13.5px;color:#fff}
.chip.f{background:var(--from);color:var(--bg)}.chip.t{background:var(--to);color:#262626}
.chip.t button{color:#262626}
.chip button{background:none;border:0;color:#fff;font-size:15px;line-height:1;padding:0 0 0 2px;cursor:pointer}
.muted{color:var(--muted);font-size:13.5px}
.empty{color:var(--muted);background:var(--bg);border-radius:8px;padding:14px;font-size:14px}
table{width:100%;border-collapse:collapse;margin-top:6px}
th{font-size:12.5px;color:var(--muted);font-weight:500;text-align:left;padding:4px 4px}
td{padding:3px 4px}
td:first-child{font-size:14px;white-space:nowrap;padding-right:8px}
td input[type=text]{padding:6px 8px;text-align:right;font-variant-numeric:tabular-nums}
td input.set{border-color:var(--brand);background:var(--surface);font-weight:700}
td input.bad{border-color:var(--danger)}
.row{display:flex;gap:8px;align-items:center;margin-top:12px;flex-wrap:wrap}
.row input[type=text]{width:84px}
.btn{font:600 14px Inter,system-ui,sans-serif;border-radius:8px;padding:9px 14px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer}
.btn.primary{background:var(--brand);border-color:var(--brand);color:#262626;font-weight:700;width:100%;margin-top:16px;padding:11px}
.btn.small{padding:5px 10px;font-size:13px}
.btn.link{border:0;background:none;color:var(--ink);text-decoration:underline;text-decoration-color:var(--brand);text-decoration-thickness:2px;text-underline-offset:3px;padding:4px 6px}
.btn.del{color:var(--danger)}
.check{display:flex;align-items:center;gap:8px;margin-top:12px;font-size:14px}
.check input{width:18px;height:18px;accent-color:var(--brand)}
.list{list-style:none;margin:0;padding:0}
.list li{display:flex;align-items:center;gap:8px;padding:8px 0;border-top:1px solid var(--line)}
.list li:first-child{border-top:0}
.list .r{flex:1;min-width:0}
.list .r b{font-weight:600}
.list .r span{display:block;color:var(--muted);font-size:12.5px}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--surface);padding:10px 16px;border-radius:8px;font-weight:600;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s}
#toast.show{opacity:1}
@media (max-width:880px){
  body{height:auto;min-height:100%}
  .app{display:block}
  .mapwrap{height:62vh;min-height:360px}
  .panel{border-left:0;border-top:1px solid var(--line)}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header>
  <h1>Exception pricing</h1>
  <p>Cyclone Couriers prototype. 2026 rates. Distances are estimated from zone centres.</p>
</header>
<main class="app">
  <section class="mapwrap" aria-label="Zone map">
    <svg id="map" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Map of Cyclone delivery zones">
      <g id="zones"></g><g id="lines"></g><g id="labels"></g>
    </svg>
    <div class="hint" id="hint"></div>
    <div class="mapctl">
      <button id="zin" aria-label="Zoom in">+</button>
      <button id="zout" aria-label="Zoom out">−</button>
      <button id="zfit" class="fit" aria-label="Show all zones">All</button>
    </div>
    <div class="legend"><span><i style="background:var(--from)"></i>Pickup</span><span><i style="background:var(--to)"></i>Delivery</span><span><i style="background:transparent;border:2.5px solid var(--brand)"></i>Already has a price from pickup</span></div>
    <div id="tip"></div>
  </section>
  <aside class="panel">
    <h2>Client</h2>
    <label class="fld" for="client">Client name</label>
    <input type="text" id="client">
    <h2>Route</h2>
    <div id="routeBox"></div>
    <div id="priceBox"></div>
    <h2 id="listTitle">Agreed prices</h2>
    <div id="listBox"></div>
  </aside>
</main>
<div id="toast" role="status" aria-live="polite"></div>

/* rendering */
function render(){
  NAMES.forEach(n=>Z[n].el.setAttribute('class','z'));
  const linked=new Set();
  if(sel.from)Object.values(S.ex).forEach(x=>{if(x.from===sel.from)linked.add(x.to);});
  linked.forEach(n=>Z[n].el.classList.add('linked'));
  if(sel.from){Z[sel.from].el.classList.add('from');}
  sel.to.forEach(n=>Z[n].el.classList.add('to'));
  NAMES.forEach(n=>{Z[n].t.classList.toggle('on',n===sel.from||sel.to.includes(n));Z[n].t.classList.toggle('f',n===sel.from);});
  $('hint').textContent=!sel.from?'Click the pickup zone':(!sel.to.length?'Now click one or more delivery zones':'Click more zones to add or remove them. Click the pickup zone again to start over.');
  drawLines();renderRoute();renderPrices();renderList();
}
function drawLines(){
  gL.innerHTML='';const pairs={};
  Object.values(S.ex).forEach(x=>{const k=[x.from,x.to].sort().join('|');pairs[k]=(pairs[k]||0)+1;});
  Object.entries(pairs).forEach(([k,c])=>{const [a,b]=k.split('|');if(!Z[a]||!Z[b])return;
    const l=document.createElementNS(NS,'line');const p=Z[a].c,q=Z[b].c;
    l.setAttribute('x1',p[0]);l.setAttribute('y1',p[1]);l.setAttribute('x2',q[0]);l.setAttribute('y2',q[1]);
    l.setAttribute('class','ln'+(c<2?' oneway':'')+((a===sel.from||b===sel.from)?' hot':''));gL.appendChild(l);
    [p,q].forEach(pt=>{const d=document.createElementNS(NS,'circle');d.setAttribute('cx',pt[0]);d.setAttribute('cy',pt[1]);d.setAttribute('class','dot');gL.appendChild(d);});
  });
  apply();
}
function renderRoute(){
  const box=$('routeBox');
  if(!sel.from){box.innerHTML='<div class="empty"><b style="color:var(--ink)">Every route uses the matrix price</b> unless you save an agreed price here.<br><br>1. Click the pickup zone the client agreed.<br>2. Click all the delivery zones that share the same agreed price.<br>3. Enter the prices and save. That sets every route in one go.</div>';return;}
  let h='<div class="route"><span class="muted">From</span><span class="chip f">'+sel.from+'</span><span class="muted">to</span>';
  h+=sel.to.length?sel.to.map(n=>'<span class="chip t">'+n+'<button data-rm="'+n+'" aria-label="Remove '+n+'">×</button></span>').join(''):'<span class="muted">pick on map</span>';
  h+='</div>';
  if(sel.to.length===1)h+='<p class="muted" style="margin:8px 0 0">About '+km(sel.from,sel.to[0]).toFixed(1)+' km'+(S.ex[sel.from+'|'+sel.to[0]]?'. This route already has agreed prices, shown below.':'')+'</p>';
  if(sel.to.length>1)h+='<p class="muted" style="margin:8px 0 0">The same prices will be saved for all '+sel.to.length+' routes.</p>';
  h+='<div class="row" style="margin-top:8px"><button class="btn link" id="clr">Start over</button></div>';
  box.innerHTML=h;
  box.querySelectorAll('[data-rm]').forEach(b=>b.onclick=()=>{sel.to=sel.to.filter(x=>x!==b.dataset.rm);render();});
  $('clr').onclick=clearSel;
}
function renderPrices(){
  const box=$('priceBox');
  if(!sel.from||!sel.to.length){box.innerHTML='';return;}
  const one=sel.to.length===1,d=one?km(sel.from,sel.to[0]):0;
  let h='<h2>Prices</h2><p class="muted" style="margin:0">Type the agreed price, or a discount like 10% off. Leave a box blank to keep the matrix price'+(one?' (shown in grey)':'')+'.</p>';
  h+='<table><thead><tr><th>Vehicle</th>'+SVC.map(s=>'<th style="text-align:right">'+s[1]+'</th>').join('')+'</tr></thead><tbody>';
  VEH.forEach(v=>{h+='<tr><td>'+v[1]+'</td>';SVC.forEach(s=>{const k=v[0]+'_'+s[0];
    h+='<td><input type="text" inputmode="decimal" data-k="'+k+'" aria-label="'+v[1]+' '+s[1]+'" placeholder="'+(one?eur(formula(v[0],s[0],d)):'matrix')+'" value="'+(cells[k]||'')+'"></td>';});h+='</tr>';});
  h+='</tbody></table>';
  h+='<div class="row"><label class="muted" for="pct">Discount on all boxes</label><input type="text" id="pct" inputmode="decimal" placeholder="10%"><button class="btn small" id="applyPct">Apply</button><button class="btn small" id="clearCells">Clear boxes</button></div>';
  h+='<div class="row"><label class="muted" for="cut">Driver cut</label><input type="text" id="cut" inputmode="decimal" value="'+cut+'"><span class="muted">%</span></div>';
  h+='<label class="check"><input type="checkbox" id="both"'+(both?' checked':'')+'>Same price in both directions</label>';
  h+='<button class="btn primary" id="save">Save agreed prices</button>';
  box.innerHTML=h;
  box.querySelectorAll('input[data-k]').forEach(inp=>{mark(inp);inp.oninput=()=>{cells[inp.dataset.k]=inp.value;mark(inp);};});
  $('applyPct').onclick=()=>{const n=parseFloat(($('pct').value||'').replace(/[^0-9.]/g,''));if(isNaN(n)){toast('Enter a discount, for example 10');return;}
    VEH.forEach(v=>SVC.forEach(s=>{const k=v[0]+'_'+s[0];cells[k]=one?(formula(v[0],s[0],d)*(1-n/100)).toFixed(2):n+'% off';}));renderPrices();};
  $('clearCells').onclick=()=>{cells={};renderPrices();};
  $('cut').oninput=e=>cut=e.target.value;
  $('both').onchange=e=>both=e.target.checked;
  $('save').onclick=save;
}
function mark(inp){const c=parseCell(inp.value);inp.classList.toggle('set',!!c&&!c.bad);inp.classList.toggle('bad',!!c&&!!c.bad);}
function save(){
  const parsed={};let bad=false;
  Object.entries(cells).forEach(([k,v])=>{const c=parseCell(v);if(!c)return;if(c.bad)bad=true;else parsed[k]=c;});
  if(bad){toast('Fix the boxes outlined in red');return;}
  if(!Object.keys(parsed).length){toast('Enter at least one price');return;}
  const c=parseFloat(cut);if(isNaN(c)||c<0||c>100){toast('Driver cut must be between 0 and 100');return;}
  let n=0;
  sel.to.forEach(t=>{const routes=[[sel.from,t]];if(both)routes.push([t,sel.from]);
    routes.forEach(([a,b])=>{const d=km(a,b),prices={};
      Object.entries(parsed).forEach(([k,pc])=>{const [v,s]=k.split('_');prices[k]=resolve(pc,v,s,d);});
      S.ex[a+'|'+b]={from:a,to:b,prices,cut:c};n++;});});
  persist();toast('Saved '+n+' route'+(n>1?'s':''));
  sel.to=[];cells={};render();
}
function renderList(){
  const box=$('listBox'),items=Object.values(S.ex).sort((a,b)=>(a.from+a.to).localeCompare(b.from+b.to));
  $('listTitle').textContent='Agreed prices for '+(S.client||'this client');
  if(!items.length){box.innerHTML='<div class="empty">No agreed prices yet, so every route for this client uses the matrix price.</div>';return;}
  let h='<ul class="list">'+items.map(x=>{const k=Object.keys(x.prices).length;
    const sample=VEH.map(v=>v[0]).flatMap(v=>['s','p'].map(s=>v+'_'+s)).find(q=>x.prices[q]!=null);
    const vs=sample?VEH.find(v=>v[0]===sample.split('_')[0])[1]+' '+(sample.endsWith('_s')?'Standard':'Priority')+' '+eur(x.prices[sample]):'';
    return '<li><div class="r"><b>'+x.from+' to '+x.to+'</b><span>'+k+' of '+VEH.length*2+' prices agreed. '+vs+(k>1?' and more':'')+'</span></div>'+
      '<button class="btn small link" data-ed="'+x.from+'|'+x.to+'">Edit</button><button class="btn small link del" data-del="'+x.from+'|'+x.to+'">Delete</button></li>';}).join('')+'</ul>';
  h+='<div class="row"><button class="btn small" id="copy">Copy as spreadsheet rows</button><span class="muted">'+items.length+' route'+(items.length>1?'s':'')+'</span></div>';
  box.innerHTML=h;
  box.querySelectorAll('[data-ed]').forEach(b=>b.onclick=()=>{const [a,t]=b.dataset.ed.split('|');sel={from:a,to:[t]};cells={};both=false;prefill();render();
    if(window.innerWidth<=880)$('priceBox').scrollIntoView({behavior:'smooth'});});
  box.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{delete S.ex[b.dataset.del];persist();toast('Deleted '+b.dataset.del.replace('|',' to '));render();});
  $('copy').onclick=async()=>{
    const rows=[['Client','From zone','To zone','Vehicle','Service','Customer charge','Driver cut %']];
    items.forEach(x=>VEH.forEach(v=>SVC.forEach(s=>{const p=x.prices[v[0]+'_'+s[0]];if(p!=null)rows.push([S.client,x.from,x.to,v[1],s[1],p.toFixed(2),x.cut]);})));
    try{await navigator.clipboard.writeText(rows.map(r=>r.join('\t')).join('\n'));toast('Copied '+(rows.length-1)+' prices');}catch(e){toast('Your browser blocked copying');}
  };
}
let tt;function toast(m){const t=$('toast');t.textContent=m;t.classList.add('show');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('show'),2200);}
const cl=$('client');cl.value=S.client;cl.oninput=()=>{S.client=cl.value;persist();$('listTitle').textContent='Agreed prices for '+(S.client||'this client');};
fit();render();requestAnimationFrame(apply);
})();
</script>
</body>
</html>
